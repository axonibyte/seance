# CBSD external-module manifest.
#
# Read by 'cbsd module' (system/module:45,67) to learn where the module wants
# to live, and by nothing else. MODULE_DIR must begin with the literal
# "${CIX_DISTDIR}/modules" (system/module:78-82); the repository root *is* the
# module directory (decision D-1), so a clone into
# /usr/local/cbsd/modules/seance.d is a complete installation.
CBSDMODULE="seance"
MODULE_DIR="${CIX_DISTDIR}/modules/seance.d"
MYDESC="Guest succession: replication, death detection, fencing, promotion"
