# seance under reaper.
#
# One guest, host execution: the suite is FreeBSD /bin/sh, ZFS, jails and CBSD,
# and there is nothing a container could stand in for. The template supplies
# the toolchain, so [build] carries no image -- a host build may not.
#
# Tiers 1-4 are the build (they are cheap enough), tiers 5-7 are the run.

schema = 1
project = "seance"
guests = ["freebsd-15.1"]
exec = "host"

[build]
cmd = "sh tools/lint.sh"
# CBSD arrives by pkg in the run's prologue; the cache is what keeps the second
# and every later session from re-fetching it over the network.
cache = ["pkg"]

[run]
cmd = "sh tests/run.sh"

[run.env]
# The workstation runs 1-4 in milliseconds after every edit; the session exists
# for the tiers that need root, ZFS and jails.
SEANCE_TIERS = "5,6,7"

[sync]
exclude = ["/out/"]

[reset]
datasets = ["state"]

[resources]
cores = 4
ram_gb = 16

# Long tier-7 hunts: opt-in, and given a TTL that outlives them.
[profiles.hunt]
ttl = "6h"
env = { SEANCE_HUNT = "1" }

# The same hunt WITHOUT the 2 h 45 m committed battery in front of it (D-162).
# The oracle self-test still runs; the stage says loudly that the battery did
# not, so a green run here is never an acceptance run.
[profiles.huntonly]
ttl = "6h"
env = { SEANCE_HUNT = "1", SEANCE_HUNT_ONLY = "1", SEANCE_TIERS = "7" }

# The even-N profile. TESTING.md §2 makes the even-N freeze a boundary the
# suite has to exercise, and tier 7's default fleet is three nodes; this is the
# same battery against four, where a clean half-split is expressible.
[profiles.evenn]
env = { SEANCE_SIM_N = "4", SEANCE_TIERS = "7" }
